name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version bump and changelog
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require version bump and matching changelog
        shell: powershell
        env:
          BASE: ${{ github.base_ref }}
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --quiet origin $env:BASE

          $manifest = Get-Content -LiteralPath Cargo.toml -Raw
          $headMatch = [regex]::Match(
              $manifest,
              '(?m)^version = "(?<version>\d+\.\d+\.\d+)"\r?$'
          )
          if (-not $headMatch.Success) {
              throw "Cargo.toml does not contain a SemVer package version."
          }
          $headVersion = [version]$headMatch.Groups["version"].Value

          $baseManifest = git show "origin/$env:BASE`:Cargo.toml" 2>$null
          if ($LASTEXITCODE -eq 0) {
              $baseMatch = [regex]::Match(
                  ($baseManifest -join "`n"),
                  '(?m)^version = "(?<version>\d+\.\d+\.\d+)"\r?$'
              )
              if (-not $baseMatch.Success) {
                  throw "The base Cargo.toml has no SemVer package version."
              }
              $baseVersion = [version]$baseMatch.Groups["version"].Value
          }
          else {
              $baseVersion = [version]"0.0.0"
          }

          if ($headVersion -le $baseVersion) {
              throw "Version must increase: base=$baseVersion head=$headVersion."
          }

          $added = @(
              git diff --diff-filter=A --name-only `
                  "origin/$env:BASE...HEAD" -- "changelog/*.md"
          )
          $expected = "changelog/$headVersion.md"
          if ($added.Count -ne 1 -or $added[0] -ne $expected) {
              throw "Each PR must add exactly $expected; found: $($added -join ', ')."
          }
          Write-Host "Version gate passed: $baseVersion -> $headVersion."

  windows:
    name: Windows build, quality, and package
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: engine/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy, rustfmt

      - name: Verify Go dependencies and formatting
        shell: powershell
        working-directory: engine
        run: |
          go mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $unformatted = @(gofmt -l .)
          if ($unformatted.Count -ne 0) {
              gofmt -d .
              throw "gofmt required for: $($unformatted -join ', ')."
          }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Rust formatting, lint, and tests
        shell: powershell
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned PowerShell analyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 `
              -Scope CurrentUser -Force

      - name: Verify PowerShell syntax, analysis, and formatting
        shell: powershell
        run: ./scripts/test-powershell.ps1

      - name: Read package version
        id: version
        shell: powershell
        run: |
          $manifest = Get-Content -LiteralPath Cargo.toml -Raw
          $match = [regex]::Match(
              $manifest,
              '(?m)^version = "(?<version>\d+\.\d+\.\d+)"\r?$'
          )
          if (-not $match.Success) {
              throw "Cargo.toml does not contain a SemVer package version."
          }
          "value=$($match.Groups['version'].Value)" >> $env:GITHUB_OUTPUT

      - name: Build native executables
        shell: powershell
        run: ./scripts/build-native.ps1

      - name: Package release candidate
        shell: powershell
        run: >-
          ./scripts/package-release.ps1
          -Version "${{ steps.version.outputs.value }}"

      - name: Verify archive, manifest, executable, and checksum
        shell: powershell
        run: >-
          ./scripts/test-release.ps1
          -Version "${{ steps.version.outputs.value }}"

      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailbox-windows-x64
          path: |
            dist/tailbox-windows-x64.zip
            dist/tailbox-windows-x64.zip.sha256
          if-no-files-found: error
