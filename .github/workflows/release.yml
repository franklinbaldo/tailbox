name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: engine/go.sum

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "value=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            "value=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          }
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            '${{ github.ref_name }}'.TrimStart('v')
          }
          $manifest = Get-Content -LiteralPath Cargo.toml -Raw
          if ($manifest -notmatch "(?m)^version = `"$([regex]::Escape($version))`"\r?$") {
            throw "Release version $version does not match Cargo.toml."
          }
          $isPrerelease = ($version -eq "0.1.0").ToString().ToLowerInvariant()
          "prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Build and test
        shell: pwsh
        run: ./scripts/build-native.ps1

      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Verify package
        shell: pwsh
        run: ./scripts/test-release.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: changelog/${{ steps.version.outputs.value }}.md
          files: |
            install.ps1
            dist/tailbox-windows-x64.zip
            dist/tailbox-windows-x64.zip.sha256
